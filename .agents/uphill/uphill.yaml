# Uphill measures itself. Run `uphill check` from any directory in this repository.

footprint:
  run: sh .agents/uphill/metrics/footprint.sh
  # Bytes of the stripped release binary that users download.
  binary-size: {}
  # Third-party crates compiled into the binary.
  dependencies: {}

speed:
  run: bun .agents/uphill/metrics/speed.ts
  # Time from launch to exit of `uphill --version`.
  startup: {}
  # Time `uphill check` takes for one category whose script writes one line.
  check: {}

# The repository's commit pins its convention packs. Each installs its tools from its lockfile.
packs:
  - { pack: ./packs/rust, install: true }
  - { pack: ./packs/writing-docs, install: true }
  - { pack: ./packs/git, install: true }
  - { pack: ./packs/typescript, install: true }
