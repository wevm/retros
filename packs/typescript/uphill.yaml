# TypeScript conventions in tracked .ts, .tsx, .cts and .mts files, including declarations.
# Source archives without Git use matching files outside the excluded output and dependency
# directories. Each source file is an item. Syntax checks skip files that OXC cannot parse.

# With `install: true`, the pack installs oxlint, oxfmt, oxc-parser, and the TypeScript binding
# API from its lockfile. The project's compiler, linter, and formatter check its own conventions.

# Every category reads the lines of this one script, which runs once.
run: bun metrics/typescript.ts

correctness:
  # Checks files listed by the project's tsc or tsgo, including referenced projects. Files
  # outside its programs skip. Diagnostics without a measured source file use the config as item.
  type-errors: {}
  # Whether tsconfig.json sets `strict`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`,
  # and `verbatimModuleSyntax`, which the conventions treat as design constraints.
  compiler-options: {}
  # Whether each file avoids `any`, by oxlint's `typescript/no-explicit-any`.
  explicit-any: {}
  # Whether the project's linter, with its own configuration, reports nothing in each file. The
  # linter is `bun lint` when bunfig.toml has a `[lint]` section or a script runs it, or else the
  # first of ESLint, Biome, oxlint, and Vite Plus in package.json. Without one, the pack's oxlint runs.
  lint: {}
  # Whether each file avoids `Math.random()`, by oxlint's `eslint/no-restricted-properties`. Use
  # `crypto.getRandomValues()`.
  math-random: {}
  # Whether files under `src/` log nothing through `console`, by oxlint's `eslint/no-console`.
  console-calls: {}

style:
  # Whether the project's formatter, with its own configuration, leaves each file unchanged. The
  # formatter is `bun fmt` when bunfig.toml has a `[fmt]` section or a script runs it, or else the
  # first of Prettier, Biome, dprint, oxfmt, and Vite Plus in package.json. Without one, the pack's
  # oxfmt runs.
  formatted: {}
  # Whether each file avoids enums. Use unions or `as const` objects.
  enums: {}
  # Whether each file declares shapes with `type`, by oxlint's
  # `typescript/consistent-type-definitions`.
  interfaces: {}
  # Whether array annotations are readonly, except where tracked code directly mutates the
  # binding or a function's result. Mutations in downstream packages are not visible.
  mutable-arrays: {}
  # Whether imports name their file extension, by oxlint's `import/extensions`, so the source stays
  # valid under NodeNext.
  import-extensions: {}
  # Whether type-only imports and exports say `type`. oxlint checks imports. The TypeScript
  # checker resolves named exports. An unresolved export skips unless another violation is known.
  type-imports: {}
  # Whether module constants are camelCase, not UPPER_CASE.
  uppercase-constants: {}
  # Whether option bags default in the signature (`options: fn.Options = {}`), not `options?`.
  optional-options: {}
  # Whether option bags are named `options`, not `args`, `opts`, or `params`.
  option-names: {}
  # Whether functions take at most two positional parameters, a receiver and then options, by
  # oxlint's `eslint/max-params`.
  positional-parameters: {}
  # Whether functions take parameters whole and destructure them in the body.
  destructured-parameters: {}
  # Whether each file avoids nested ternaries, by oxlint's `eslint/no-nested-ternary`. Use an IIFE
  # with early returns.
  nested-ternaries: {}
  # Whether local variables have no inline object types. Name the type above the use.
  inline-object-types: {}
  # Whether a function's types live in its namespace (`create.Options`), not beside it
  # (`CreateOptions`).
  function-namespaces: {}
  # Whether values are returned directly, not bound and returned on the next line.
  immediate-returns: {}
  # Whether a fallible value comes from an IIFE, not a `let` assigned across `try` and `catch`.
  let-across-try: {}
  # Whether each file has no section-divider comments, such as `// ----`.
  section-dividers: {}

architecture:
  # Whether no module imports itself through a cycle, by oxlint's `import/no-cycle`.
  import-cycles: {}
  # Whether module-shaped files, such as `./Store.js`, are imported as namespaces
  # (`import * as Store`) instead of by name. Types and components may be named.
  namespace-imports: {}
  # Whether Node built-ins are imported as namespaces (`import * as fs from 'node:fs'`).
  node-imports: {}
  # Whether modules are re-exported as namespaces (`export * as Store`), not flattened into a
  # barrel with `export *` or `export { … } from`.
  flat-reexports: {}
  # Whether imports are static. A dynamic import marks a real runtime or bundle boundary.
  dynamic-imports: {}
  # Whether each file avoids imports for their side effects, such as `import './register.js'`, by
  # oxlint's `import/no-unassigned-import`.
  side-effect-imports: {}
  # Whether classes are limited to errors and framework entrypoints. Use functions and plain data.
  classes: {}
  # Whether each error class sets a namespaced `name`, such as `'Config.InvalidError'`.
  error-names: {}
  # Whether `this` appears only in classes. Factories close over their state.
  this-outside-classes: {}
  # Whether module scope holds only constants: no `let`, and no empty `Map` or `Set` caches.
  module-state: {}

documentation:
  # Whether each file starts with a TSDoc `@module` comment that describes its responsibility.
  module-docs: {}
  # Whether every export has TSDoc. Overloads share the first signature's comment.
  export-docs: {}
  # Whether every property of an exported type has TSDoc.
  property-docs: {}

testing:
  # Whether each test file uses real implementations: no `vi.mock`, `vi.fn`, fake timers, stubbed
  # globals, or mocking packages. oxlint's restricted-method and restricted-import rules report them.
  mocks: {}
  # Whether each test file asserts with inline snapshots, not `toBe` or `toEqual`.
  inline-snapshots: {}
  # Whether the project keeps no snapshot files. Snapshots are inline.
  snapshot-files: {}
  # Whether tests wait for observable conditions, not `setTimeout` or `Bun.sleep`. oxlint's
  # restricted-global and restricted-property rules report them.
  sleeps: {}
  # Whether each module has one test file, not `Module.context.test.ts` files.
  split-test-files: {}

configuration:
  # Whether the project has no JavaScript source files. Configuration files are exempt.
  javascript-files: {}
  # Whether each named, non-private package declares sideEffects as a boolean or file-pattern list.
  side-effects: {}
  # Whether each package.json in a pnpm workspace references its versions with `catalog:`.
  catalog-versions: {}
  # Whether scripts run TypeScript directly, not through `tsx` or `ts-node`.
  script-runners: {}
  # Whether the dependencies and scripts of each package.json are in alphabetical order.
  sorted-keys: {}
