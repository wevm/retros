# TypeScript conventions in tracked .ts, .tsx, .cts and .mts files, including declarations, and
# what a published library costs the projects that use it. Source archives without Git use
# matching files outside the excluded output and dependency directories. Each source file is an
# item. Syntax checks skip files that OXC cannot parse.

# With `install: true`, the pack installs oxlint, oxfmt, oxc-parser, the TypeScript binding API,
# rolldown, fast-check, acorn, and magic-string from its lockfile. The project's compiler, linter,
# formatter, and vitest check its own conventions and run its tests.

# The library categories, from `footprint` on, read the build and the entry points of package.json
# `exports`, so build the package first, and set `setup` to build each checkout that `--compare`
# creates. Without an ES module entry point, as in an application, their metrics skip. The project
# sets its own inputs in `.agents/uphill/typescript/config.ts`, whose type is `Config` in
# metrics/library.ts.
# Items are named the way users import them: a namespace member as `<entry>:<Namespace>.<member>`,
# such as `lib:Math.add`, a whole namespace as `lib:Math`, and an index entry by its specifier.

# Every convention category reads the lines of this one script, which runs once.
run: bun metrics/typescript.ts

correctness:
  # Checks files listed by the project's tsc or tsgo, including referenced projects. Files
  # outside its programs skip. Diagnostics without a measured source file use the config as item.
  type-errors:
    description: Fix every type error. Run the project's `tsc` or `tsgo` to check.
  compiler-options:
    description:
      Set `strict`, `exactOptionalPropertyTypes`, `noUncheckedIndexedAccess`, and
      `verbatimModuleSyntax` in tsconfig.json. Treat them as design constraints.
  explicit-any:
    description:
      Avoid `any`. Use a precise type, validation, or narrowing (oxlint
      `typescript/no-explicit-any`).
  # The linter is `bun lint` when bunfig.toml has a `[lint]` section or a script runs it, or else
  # the first of ESLint, Biome, oxlint, and Vite Plus in package.json. Without one, the pack's
  # oxlint runs.
  lint:
    description: Fix every report of the project's linter with its own configuration.
  math-random:
    description: Use `crypto.getRandomValues()`, not `Math.random()` (oxlint
      `eslint/no-restricted-properties`).
  console-calls:
    description: Do not log through `console` in files under `src/` (oxlint `eslint/no-console`).

style:
  # The formatter is `bun fmt` when bunfig.toml has a `[fmt]` section or a script runs it, or else
  # the first of Prettier, Biome, dprint, oxfmt, and Vite Plus in package.json. Without one, the
  # pack's oxfmt runs.
  formatted:
    description:
      Format each TypeScript file with the project's formatter and its own
      configuration.
  enums:
    description: Avoid enums. Use unions or `as const` objects.
  interfaces:
    description: Declare shapes with `type`, not `interface` (oxlint
      `typescript/consistent-type-definitions`).
  # Mutations in downstream packages are not visible, so only tracked code exempts an array.
  mutable-arrays:
    description:
      Annotate arrays as `readonly T[]`. Keep an array mutable only where code mutates
      the binding or a function's result.
  import-extensions:
    description:
      Name the file extension in each import, so the source stays valid under NodeNext
      (oxlint `import/extensions`).
  # oxlint checks imports. The TypeScript checker resolves named exports. An unresolved export
  # skips unless another violation is known.
  type-imports:
    description: Use `import type` and `export type` for type-only imports and exports.
  uppercase-constants:
    description: Name module constants in camelCase, not UPPER_CASE.
  optional-options:
    description:
      'Default option bags in the signature (`options: fn.Options = {}`), not with
      `options?`.'
  option-names:
    description: Name option bags `options`, not `args`, `opts`, or `params`.
  positional-parameters:
    description:
      Give each function at most two positional parameters, a receiver and then an
      options bag (oxlint `eslint/max-params`).
  destructured-parameters:
    description:
      Do not destructure parameters in the signature. Take each parameter whole and
      destructure it in the body.
  nested-ternaries:
    description: Avoid nested ternaries. Use an IIFE with early returns (oxlint
      `eslint/no-nested-ternary`).
  inline-object-types:
    description:
      Do not annotate local variables with inline object types. Name the type above the
      use.
  function-namespaces:
    description:
      Put a function's types in its namespace (`create.Options`), not beside it
      (`CreateOptions`).
  immediate-returns:
    description: Return values directly. Do not bind a value only to return it on the next line.
  let-across-try:
    description:
      Derive a fallible value in an IIFE, not in a `let` assigned across `try` and
      `catch`.
  section-dividers:
    description: Do not write section-divider comments, such as `// ----`.

architecture:
  import-cycles:
    description:
      Avoid import cycles. No module may import itself through other modules (oxlint
      `import/no-cycle`).
  namespace-imports:
    description:
      Import module-shaped files, such as `./Store.js`, as namespaces (`import * as
      Store`). Types and components may use named imports.
  node-imports:
    description: Import Node built-ins as namespaces (`import * as fs from 'node:fs'`).
  flat-reexports:
    description:
      Re-export modules as namespaces (`export * as Store`). Do not flatten them into a
      barrel with `export *` or `export { … } from`.
  dynamic-imports:
    description: Use static imports. Use a dynamic import only at a real runtime or bundle boundary.
  side-effect-imports:
    description:
      Do not import modules for their side effects, such as `import './register.js'`
      (oxlint `import/no-unassigned-import`).
  classes:
    description: Use functions and plain data. Limit classes to errors and framework entrypoints.
  error-names:
    description: Set a namespaced `name` on each error class, such as `'Config.InvalidError'`.
  this-outside-classes:
    description: Use `this` only in classes. Make factories close over their state.
  module-state:
    description:
      Keep only constants at module scope. Do not use a module-scope `let` or an empty
      `Map` or `Set` cache.

documentation:
  module-docs:
    description:
      Start each TypeScript file with a TSDoc `@module` comment that describes its
      responsibility.
  export-docs:
    description:
      Document every export with TSDoc. Overloads share the comment on the first
      signature.
  property-docs:
    description: Document every property of an exported type with TSDoc.

testing:
  mocks:
    description:
      Test with real implementations. Do not use `vi.mock`, `vi.fn`, fake timers,
      stubbed globals, or mocking packages (oxlint restricted-method and restricted-import rules).
  inline-snapshots:
    description: Assert with inline snapshots in TypeScript tests, not with `toBe` or `toEqual`.
  snapshot-files:
    description: Keep snapshots inline. Do not commit snapshot files.
  sleeps:
    description:
      Wait for observable conditions in tests, not with `setTimeout` or `Bun.sleep`
      (oxlint restricted-global and restricted-property rules).
  split-test-files:
    description:
      Write one test file per module. Do not split it into `Module.context.test.ts`
      files.

configuration:
  javascript-files:
    description: Write source files in TypeScript, not JavaScript. Configuration files are exempt.
  side-effects:
    description:
      Declare `sideEffects` as a boolean or a file-pattern list in each named,
      non-private package.
  catalog-versions:
    description:
      Reference dependency versions with `catalog:` in each package.json of a pnpm
      workspace.
  script-runners:
    description: Run TypeScript scripts directly, not through `tsx` or `ts-node`.
  sorted-keys:
    description: Keep the dependencies and scripts of each package.json in alphabetical order.

footprint:
  run: bun metrics/footprint.ts
  # A consumer imports each export the way users import it, such as
  # `import { Math } from 'lib'; export const $ = Math.add` for `lib:Math.add`, a whole namespace,
  # or a whole index entry. rolldown bundles and minifies each import for the browser. Above 3 kB,
  # the note names the three packages or modules that render the most bytes.
  entry-size:
    description:
      Keep the gzipped bundle small for a consumer that imports one export. Do not pull
      unrelated modules or packages into an export.
  # The check bundles `import 'lib/Math'` with `"sideEffects": false` ignored, as a bundler does
  # once the library is inlined into another package's bundle.
  tree-shaking:
    description:
      'Make each entry point bundle to nothing when unused. Annotate top-level calls with
      `/*#__PURE__*/`, and avoid runtime TypeScript namespaces and static class fields.'
  # `entry-size` of the hot items that `hot` in `.agents/uphill/typescript/config.ts` lists.
  hot-entry-size:
    description: Keep the gzipped bundle of each hot item especially small.

speed:
  run: bun metrics/speed.ts
  # The recording replays the project's vitest tests once, and is cached until the sources, the
  # tests, or the lockfile change.
  timeout: 60m
  # CPU time per call, replaying the arguments the project's tests call each function with, in a
  # fresh `node --single-threaded` process per function. The library's caches, when `caches`
  # empties them, are empty before every call, and the note gives the time with them warm.
  call-time:
    description: Keep each public function fast per call, with cold and warm caches.
  call-memory:
    description: Keep the heap bytes that each call of a public function allocates small.
    varies: true
  # CPU time in a fresh Node process, index entries included.
  import-time:
    description: Keep each entry point fast to import. Avoid work at module scope.
  import-memory:
    description: Keep the heap that each entry point holds once imported small.
  # The same four metrics for the hot items. Few hot calls allocate more than they should, and a
  # p90 would hide them, so that list scores its worst item.
  hot-call-time:
    description: Keep each hot function especially fast per call.
  hot-call-memory:
    description: Keep the heap bytes that each call of a hot function allocates especially small.
    score: max
    varies: true
  hot-import-time:
    description: Keep each hot entry point especially fast to import.
  hot-import-memory:
    description: Keep the heap that each hot entry point holds once imported especially small.

# How much of the library the speed bench reaches. It shares the speed script's run.
coverage:
  run: bun metrics/speed.ts
  timeout: 60m
  # The bench replays a call that returned or resolved in the project's tests. The note says why a
  # function has none, such as when every test calls it with a closure.
  benched:
    description:
      Call each public function in the tests with arguments that rebuild in another
      process, such as plain data. Make sure the call returns or resolves.

# Type-checking cost of every public export, values and types, from the built declarations. Each
# export gets a consumer that imports it and forces its type to resolve, checked in a fresh program
# with the library's compiler options, minus a baseline that only imports the entry. It needs Node
# 26 or later, whose V8 reports the bytes a check allocates. With an older `node` first on PATH, it
# runs its workers on `npx --yes node@26`, which needs the network the first time.
types:
  run: bun metrics/types.ts
  timeout: 15m
  # Namespace members count as exports. A use is `typeof` the value, with `Parameters` and
  # `ReturnType` for a function, or the type at its defaults, plus one level of properties.
  instantiations:
    description:
      Keep each public export cheap to type-check. Avoid types that need many
      instantiations to resolve.
  # CPU time to check the use that `instantiations` measures.
  check-time:
    description: Keep each public export fast to type-check.
  check-memory:
    description: Keep the heap bytes that type-checking each public export allocates small.
    varies: true
  # Instantiations of each test in the type-test files that `types.benches` names, with the
  # test's function added back to the file without its tests. A test that pins a count gets that
  # count plus 20% as its target.
  bench-instantiations:
    description:
      Keep the instantiations of each benchmarked type test low, within any count the
      test pins.
  # Few items have a lower target, so this list scores its worst item.
  hot-instantiations:
    description: Keep each hot export especially cheap to type-check.
    score: max

# Type-checking cost at the call sites the project's tests write: one call per public function, the
# first its own runtime tests make, else its type tests. Each call is copied into
# `const $uphill = <call>` and checked in a fresh checker once its imports and fixtures resolve.
# Instantiations are exact, so one run suffices.
call-types:
  run: bun metrics/types-calls.ts
  timeout: 20m
  instantiations:
    description:
      Keep each public function cheap to type-check at the call sites that the tests
      write.
  # Scored by the worst item.
  hot-instantiations:
    description: Keep each hot function especially cheap to type-check at its call sites.
    score: max

# Whether each public function has a call in the project's tests that call-types measures. The note
# says why not. It shares the call-types script's run.
type-coverage:
  run: bun metrics/types-calls.ts
  timeout: 20m
  type-benched:
    description:
      Call each public function in the runtime or type tests. Make sure the imports and
      fixtures of that call resolve.

# Fuzzing of every public function: boundary mutations of the arguments the project's tests pass it,
# from a corpus the speed recording fills, and the structured properties of `fuzz.properties`.
fuzz:
  run: bun metrics/fuzz.ts
  timeout: 20m
  # The note lists the harnesses, or says why there is none.
  fuzzed:
    description: Make sure each public function has a fuzz harness that runs.
  # The note gives the minimized input of a failure.
  fuzz-clean:
    description:
      Handle every input that keeps the declared types. Throw no undocumented
      TypeError, RangeError, or SyntaxError, and avoid stack overflows, hangs, and runaway memory.
      Keep each property in `fuzz.properties` true.
  # Percent of the function's own source lines in the build that ran under fuzzing.
  fuzz-coverage:
    better: higher
    description: Make every line of a public function's own source reachable by fuzzing.
  hot-fuzz-coverage:
    better: higher
    description: Make sure every line of a hot item's own source runs under fuzzing.
