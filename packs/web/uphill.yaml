# Website conventions, measured by the tools that cover them. Lighthouse audits each page of the
# built site in `dist/`, oxlint's `jsx-a11y` rules read each `.tsx` and `.jsx` file, and stylelint
# with an accessibility plugin reads each `.css` file. A metric skips when the project has
# none of the files it reads.

# Lighthouse, oxlint, and stylelint are the pack's dependencies. They install from its lockfile
# when the project's entry sets `install: true`.

# Every category reads the lines of this one script, which runs once.
run: bun metrics/web.ts

performance:
  # Gzip bytes of each script and stylesheet in the built site. No target: the baseline records
  # each size, so growth shows in review.
  asset-size: {}

accessibility:
  # Whether each page passes each audit that counts toward Lighthouse's accessibility score.
  accessibility: {}
  # Whether each component uses native controls with accessible names and keyboard support, by
  # oxlint's `jsx-a11y` rules.
  controls: {}
  # Whether each selector that sets animation or transition declares a matching reduced-motion
  # override of `none` or zero duration. This checks authored CSS, not the browser's cascade.
  reduced-motion: {}
  # Whether no `:focus` style removes the outline without a visible alternative.
  focus-outlines: {}
  # Whether each positive `:hover` selector has the corresponding `:focus` or `:focus-visible`
  # selector in the same stylesheet and nesting context. Each hover selector is an item.
  focus-styles: {}

best-practices:
  title: Best Practices
  # Whether each page passes each audit that counts toward Lighthouse's best-practices score.
  best-practices: {}
  # Whether each color has a `prefers-color-scheme` override, so light and dark schemes both work.
  color-schemes: {}
