# Website conventions, measured by the tools that cover them. Lighthouse audits each page of the
# built site in `dist/`, oxlint's `jsx-a11y` rules read each `.tsx` and `.jsx` file, and stylelint
# with an accessibility plugin reads each `.css` file. A metric skips when the project has
# none of the files it reads.

# Lighthouse, oxlint, and stylelint are the pack's dependencies. They install from its lockfile
# when the project's entry sets `install: true`.

# Every category reads the lines of this one script, which runs once.
run: bun metrics/web.ts

performance:
  # Gzip bytes of each script and stylesheet in the built site.
  asset-size:
    description: Keep scripts and stylesheets small. The baseline records each size without a
      target, so growth shows in review.

accessibility:
  # Counts each audit toward Lighthouse's accessibility score.
  accessibility:
    description: Make each page pass the Lighthouse accessibility audits.
  controls:
    description: Use native controls with accessible names and keyboard support in each component
      (oxlint `jsx-a11y`).
  # Checks authored CSS, not the browser's cascade.
  reduced-motion:
    description: Give each selector that sets an animation or a transition a reduced-motion
      override of `none` or zero duration.
  focus-outlines:
    description: Do not remove the outline in a `:focus` style without a visible alternative.
  # Each positive hover selector is an item.
  focus-styles:
    description: Match each `:hover` selector with a `:focus` or `:focus-visible` selector in the
      same stylesheet and nesting context.

best-practices:
  title: Best Practices
  # Counts each audit toward Lighthouse's best-practices score.
  best-practices:
    description: Make each page pass the Lighthouse best-practices audits.
  color-schemes:
    description: Give each color a `prefers-color-scheme` override, so light and dark schemes both
      work.
