# TigerStyle, a coding style, measured in each Rust, Zig, Go, Swift, C, and TypeScript file that
# Git tracks. Tree-sitter reads source spans and calls.
# The project's optional Clippy and oxlint supply additional length diagnostics.

# Every category reads the lines of this one script, which runs once.
run: bun metrics/tigerstyle.ts

correctness:
  # Reports whether the grammar measured each file without syntax recovery.
  source-coverage:
    description: Keep each file parseable without syntax recovery.
    weight: 0
  recursion:
    description:
      Do not write a function that calls itself. Use a loop with a bound that a reader
      can check.
  sized-integers:
    description: Use explicitly sized integers in Rust and Zig, such as `u32`, not `usize`.
  # Counts files outside tests. TigerStyle asks for "a minimum of two assertions per function" on
  # average.
  assertion-density:
    better: higher
    description:
      Assert preconditions, postconditions, and invariants, with at least two assertions
      per function on average.
  compound-assertions:
    description:
      'Check one condition in each assertion: `assert(a); assert(b);`, not
      `assert(a and b)`.'

style:
  function-length:
    description: Keep each function to 70 physical lines or fewer, including its signature.
  # Exact lines per function. Comparisons show improvements even when the file still fails.
  function-lines:
    description: Split long functions. Each line removed from a function shows in comparisons.
  line-length:
    description: Keep each line to 100 columns or fewer.
  comment-sentences:
    description:
      Write each comment as a sentence that starts with a capital letter and ends with a
      full stop or a colon.
  # Go keeps the tabs of gofmt.
  indentation:
    description: Indent code with 4 spaces.
  file-names:
    description: Name files in `snake_case`.

configuration:
  zero-dependencies:
    description: Declare no runtime dependencies in a manifest.
