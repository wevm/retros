# The four architecture lints of deslop-please.
# Each item is a file, Go package, or C source with its header. A skipped item does not score.
# See README.md for the native Rust build configuration and the scanner's coverage.

# The script that writes every metric.
run: bun metrics/deslop.ts

architecture:
  module-cycle:
    description: Do not let sibling modules use each other in a circle.
  tangle:
    description:
      Do not let the types of two modules know each other in a circle. Keep each circle
      of types to seven types or fewer.
  field-leak:
    description:
      Keep a type's fields private to its module. Code outside may read a value, but not
      write, index, or call a method on a field.
  shallow-module:
    description:
      Give each module a narrow interface. Show seven functions or fewer, or hide more
      than the module shows.
