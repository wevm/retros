# The four architecture lints of deslop-please.
# Each item is a file, Go package, or C source with its header. A skipped item does not score.
# See README.md for the native Rust build configuration and the scanner's coverage.

# The script that writes every metric.
run: bun metrics/deslop.ts

architecture:
  # Whether no circle of sibling modules that use each other includes this module.
  module-cycle: {}
  # Whether no types of this module know types of another module in a circle, and no circle has
  # more than seven types.
  tangle: {}
  # Whether code outside each type of this module leaves its fields alone: it may read a value, but
  # not write, index, or call a method on a field.
  field-leak: {}
  # Whether callers use a narrow interface of this module: it shows seven functions or fewer, or
  # hides more than it shows.
  shallow-module: {}
