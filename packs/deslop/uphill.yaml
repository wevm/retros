# The four lints of deslop-please (https://github.com/deterministic-machines/deslop-please), an
# architectural linter: deep modules, narrow interfaces. deslop-please measures a Cargo workspace
# when it is installed, and a small scanner measures Rust without it and Zig, Go, Swift, C, and
# TypeScript. A module is a file, a Go package, or a C source with its header, and each module is an
# item. The pack leaves out `wide-directory` and `long-file`, which measure size, not structure.

# The script that writes every metric.
run: bun metrics/deslop.ts

architecture:
  # Whether no circle of sibling modules that use each other includes this module.
  module-cycle: {}
  # Whether no types of this module know types of another module in a circle, and no circle has
  # more than seven types.
  tangle: {}
  # Whether code outside each type of this module leaves its fields alone: it may read a value, but
  # not write, index, or call a method on a field.
  field-leak: {}
  # Whether callers use a narrow interface of this module: it shows seven functions or fewer, or
  # hides more than it shows.
  shallow-module: {}
