[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/wevm/uphill"
rust-version = "1.97.0"
version = "0.0.0"

[workspace.dependencies]
engine = { path = "crates/engine" }
insta = "1"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
# preserve_order keeps categories and metrics in the order uphill.toml declares them.
toml = { version = "1", default-features = false, features = ["parse", "preserve_order", "std"] }
yaml-rust2 = { version = "0.13.2", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
similar_names = "allow"
todo = "warn"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package.insta]
opt-level = 3

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
strip = "symbols"
