name: Uphill
description: Run Uphill, compare a pull request with its base branch, and keep one comment with the report.
author: wevm
branding:
  color: gray-dark
  icon: trending-up

inputs:
  args:
    default: ''
    description: More arguments for uphill, such as a category or `--require-targets`.
  comment:
    default: 'true'
    description: Keep one comment on the pull request with the report. The job summary always has it.
  compare:
    default: ${{ github.base_ref }}
    description: The branch, tag, or commit to compare with. It defaults to the base branch on pull requests and to none elsewhere. An empty value skips the comparison.
  github-token:
    default: ${{ github.token }}
    description: The token that writes the comment. It needs the `pull-requests` write permission, and with `publish` also `contents`, `deployments`, and `pages` write.
  publish:
    default: 'false'
    description: Publish report.html to GitHub Pages from the gh-pages branch, create a deployment with its URL, and link it from the comment.
  version:
    default: ''
    description: The Uphill release to install, such as `0.0.1`, or `latest`. It defaults to the action's own tag, or `latest` when the action is not used at a release tag. `none` uses the uphill already on PATH.
  working-directory:
    default: .
    description: The project root, which holds uphill.yaml, uphill.toml, or the .agents directory.

outputs:
  exit-code:
    description: The exit status of uphill.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: The path of report.md.
    value: ${{ steps.run.outputs.report }}
  url:
    description: The GitHub Pages URL of report.html, when `publish` is true and publishing succeeded.
    value: ${{ steps.publish.outputs.url }}

runs:
  using: composite
  steps:
    - name: Install Uphill
      if: inputs.version != 'none'
      shell: sh
      env:
        ACTION_REF: ${{ github.action_ref }}
        UPHILL_INSTALL: ${{ runner.temp }}/uphill
        VERSION: ${{ inputs.version }}
      run: |
        case "$VERSION:$ACTION_REF" in
          :v[0-9]*.[0-9]*.[0-9]*) version=$ACTION_REF ;;
          :*) version=latest ;;
          *) version=$VERSION ;;
        esac
        UPHILL_VERSION=$version sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$UPHILL_INSTALL/bin" >> "$GITHUB_PATH"

    - name: Run Uphill
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        COMPARE: ${{ inputs.compare }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        command=(uphill)

        # `--compare` checks out the revision in a worktree, so the clone must have it.
        # actions/checkout fetches only the head commit by default.
        if [ -n "$COMPARE" ]; then
          ref=$COMPARE
          if ! git rev-parse --quiet --verify "$ref^{commit}" > /dev/null; then
            depth=
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then depth=--depth=1; fi
            git fetch --no-tags $depth origin "+$ref:refs/remotes/origin/$ref"
            ref=origin/$ref
          fi
          command+=(--compare "$ref")
        fi

        read -ra args <<< "$ARGS"
        command+=("${args[@]}")

        log=$(mktemp)
        rm -f .uphill/comment.md .uphill/report.md .uphill/report.json .uphill/report.html
        set +e
        "${command[@]}" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}

        # An unzipped artifact takes its file's name, so each working directory gets its own.
        slug=$(printf '%s' "$WORKING_DIRECTORY" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//; s/-*$//')
        html=
        if [ -f .uphill/report.html ]; then
          html=$RUNNER_TEMP/uphill-report${slug:+-$slug}.html
          cp .uphill/report.html "$html"
        fi

        {
          echo "command=${command[*]}"
          echo "exit-code=$status"
          echo "html=$html"
          echo "log=$log"
          echo "report=$PWD/.uphill/report.md"
          echo "slug=$slug"
        } >> "$GITHUB_OUTPUT"

    # An unzipped HTML artifact opens in the browser, so the comment links the full report.
    - name: Upload report
      id: upload
      if: always() && steps.run.outputs.html != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        archive: false
        path: ${{ steps.run.outputs.html }}

    # A Pages site serves each report at a stable URL, which anyone who can read the site opens.
    # A pull request from a fork has a read-only token, so it skips this step.
    - name: Publish report
      id: publish
      if: >-
        always() && inputs.publish == 'true' && steps.run.outputs.html != '' &&
        (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository)
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BRANCH: gh-pages
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        HTML: ${{ steps.run.outputs.html }}
        NUMBER: ${{ github.event.pull_request.number }}
        SLUG: ${{ steps.run.outputs.slug }}
      run: |
        # Publishing is a convenience, so a failure warns, and the comment links the artifact.
        warn() {
          echo "::warning::$1 The comment links the artifact instead."
          exit 0
        }

        # Each pull request and branch keeps its own directory, so one run leaves the others.
        if [ -n "$NUMBER" ]; then
          name=pr-$NUMBER
        else
          name=$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9._' '-' | sed 's/^-*//; s/-*$//')
        fi
        name=${name:-run-$GITHUB_RUN_ID}
        path=uphill/${SLUG:+$SLUG/}$name
        json=$PWD/.uphill/report.json

        # Pages serves one source, so Uphill publishes only when that source is the branch or unset.
        pages=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2> /dev/null) || pages=
        if [ -n "$pages" ]; then
          source=$(jq -r 'if .build_type == "legacy" then .source.branch else "a workflow" end' <<< "$pages")
          if [ "$source" != "$BRANCH" ]; then warn "GitHub Pages publishes $source, not $BRANCH."; fi
        fi

        # A run that pushes between this run's fetch and push rejects the push, so it fetches again.
        site=$RUNNER_TEMP/uphill-site
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
        push() (
          rm -rf "$site"
          git init -q "$site"
          cd "$site" || return 1
          git config "http.$GITHUB_SERVER_URL/.extraheader" "$header"
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

          heads=$(git ls-remote --heads origin "refs/heads/$BRANCH") || return 1
          if [ -n "$heads" ]; then
            git fetch -q --depth=1 origin "$BRANCH" || return 1
            git checkout -q -B "$BRANCH" FETCH_HEAD || return 1
          else
            # A new branch skips Jekyll. An existing one keeps its own setup.
            git checkout -q --orphan "$BRANCH"
            : > .nojekyll
          fi

          rm -rf "$path"
          mkdir -p "$path/badges"
          cp "$HTML" "$path/index.html"

          # Each category gets a Shields endpoint badge, colored by its score band.
          if [ -f "$json" ]; then
            cp "$json" "$path/report.json"
            jq -r '.categories[] | [([.name, .subject] | map(select(.)) | join("-")), ({
              color: (if .score == null then "lightgrey" elif .score >= 90 then "0c6" elif .score >= 50 then "fa3" else "f33" end),
              label: (.title + (if .subject then " (\(.subject))" else "" end)),
              message: (if .score == null then "failed" else "\(.score)" end),
              schemaVersion: 1
            } | tojson)] | @tsv' "$json" | while IFS=$'\t' read -r file badge; do
              printf '%s\n' "$badge" > "$path/badges/$file.json"
            done
          fi

          git add -A
          git diff --cached --quiet || git commit -qm "Publish the Uphill report for $name at ${HEAD_SHA:0:7}"
          git push -q origin "HEAD:refs/heads/$BRANCH"
        )
        # A random wait keeps runs that pushed at once from colliding again.
        for attempt in 1 2 3 4 5; do
          if push; then break; fi
          if [ "$attempt" = 5 ]; then warn "Uphill could not push the report to $BRANCH, which needs the contents write permission."; fi
          sleep $((attempt + RANDOM % 4))
        done

        # A repository without Pages gets a site from the branch, when the token may create one.
        # The workflow token may not, so its first run asks for the site in Settings.
        # A push with the workflow token does not build the site, so Uphill requests a build.
        if [ -z "$pages" ]; then
          pages=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f "source[branch]=$BRANCH" -f 'source[path]=/') ||
            warn "Uphill pushed the report to $BRANCH, but GitHub Pages is off. Select $BRANCH in Settings, Pages."
        elif ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null; then
          echo "::warning::Uphill could not request a GitHub Pages build, which needs the pages write permission."
        fi

        url=$(jq -r '.html_url' <<< "$pages")
        url=${url%/}/$path/
        echo "url=$url" >> "$GITHUB_OUTPUT"

        # Pull requests share a preview environment, so each one's deployment stays active.
        environment=uphill${SLUG:+-$SLUG}
        transient=false
        if [ -n "$NUMBER" ]; then
          environment=$environment-preview
          transient=true
        fi
        deployments=repos/$GITHUB_REPOSITORY/deployments
        if ! id=$(jq -n --arg environment "$environment" --arg ref "$HEAD_SHA" --argjson transient "$transient" \
          '{auto_merge: false, environment: $environment, production_environment: false, ref: $ref, required_contexts: [], transient_environment: $transient}' |
          gh api "$deployments" --input - --jq .id); then
          echo "::warning::Uphill could not create a deployment, which needs the deployments write permission."
          exit 0
        fi
        jq -n --argjson inactive "$([ "$transient" = true ] && echo false || echo true)" --arg log "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg url "$url" \
          '{auto_inactive: $inactive, environment_url: $url, log_url: $log, state: "success"}' |
          gh api "$deployments/$id/statuses" --input - > /dev/null ||
          echo "::warning::Uphill could not set the status of deployment $id."

    - name: Post report
      if: always() && steps.run.outputs.exit-code != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ steps.run.outputs.command }}
        COMMENT: ${{ inputs.comment }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        LOG: ${{ steps.run.outputs.log }}
        MARKER: '<!-- uphill: ${{ inputs.working-directory }} -->'
        NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.run.outputs.report }}
        REPORT_URL: ${{ steps.publish.outputs.url || steps.upload.outputs.artifact-url }}
      run: |
        # Uphill writes `comment.md`: a heading and a table of score gauges for the compared revision
        # and this run.
        comment=${REPORT%report.md}comment.md
        body=$(mktemp)
        {
          echo "$MARKER"
          if [ -f "$comment" ]; then cat "$comment"; else printf '## Uphill\n'; fi
          printf '\n'
          if [ -n "$REPORT_URL" ]; then printf '**[View the full report →](%s)**\n\n' "$REPORT_URL"; fi

          # A run that wrote a report has its failures there, so only one without shows the output.
          if [ "$EXIT_CODE" != 0 ]; then
            printf '> [!CAUTION]\n> `%s` exited with status %s.\n\n' "$COMMAND" "$EXIT_CODE"
            if [ ! -f "$comment" ]; then
              printf '<details><summary>Output</summary>\n\n```text\n'
              tail -n 60 "$LOG"
              printf '```\n\n</details>\n\n'
            fi
          fi

          printf '<sub>`%s` at %s in [run %s](%s/%s/actions/runs/%s)</sub>\n' \
            "$COMMAND" "${HEAD_SHA:0:7}" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
        } > "$body"

        # The job summary also has the whole report, for runs without a comment.
        {
          cat "$body"
          if [ -f "$REPORT" ]; then printf '\n'; cat "$REPORT"; fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != true ] || [ -z "$NUMBER" ]; then exit 0; fi

        # GitHub rejects a comment over 65,536 characters, so a long one keeps its start.
        if [ "$(wc -c < "$body")" -gt 65000 ]; then
          head -c 64000 "$body" > "$body.short"
          printf '\n\nThe comment is too long. The job summary has all of it.\n' >> "$body.short"
          mv "$body.short" "$body"
        fi

        # The comment is a convenience, so a failure to write it warns instead of failing the job.
        comments=repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments
        if ! ids=$(gh api --paginate "$comments" --jq '.[] | select(.body | startswith(env.MARKER)) | .id'); then
          echo "::warning::Uphill could not read the comments on the pull request. The job summary has the report."
          exit 0
        fi

        id=${ids%%$'\n'*}
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
        else
          gh api "$comments" -F "body=@$body" > /dev/null
        fi || echo "::warning::Uphill could not comment on the pull request, and a pull request from a fork has a read-only token. The job summary has the report."

    - name: Exit with the status of uphill
      if: steps.run.outputs.exit-code != '0'
      shell: sh
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$EXIT_CODE"
