name: Uphill
description: Run Uphill, compare a pull request with its base branch, and keep one comment with the report.
author: wevm
branding:
  color: gray-dark
  icon: trending-up

inputs:
  args:
    default: ''
    description: More arguments for uphill, such as a category or `--require-targets`.
  comment:
    default: 'true'
    description: Keep one comment on the pull request with the report. The job summary always has it.
  compare:
    default: ${{ github.base_ref }}
    description: The branch, tag, or commit to compare with. It defaults to the base branch on pull requests and to none elsewhere. An empty value skips the comparison.
  github-token:
    default: ${{ github.token }}
    description: The token that writes the comment. It needs the `pull-requests` write permission.
  version:
    default: ''
    description: The Uphill release to install, such as `0.0.1`, or `latest`. It defaults to the action's own tag, or `latest` when the action is not used at a release tag. `none` uses the uphill already on PATH.
  working-directory:
    default: .
    description: The project root, which holds uphill.yaml, uphill.toml, or the .agents directory.

outputs:
  exit-code:
    description: The exit status of uphill.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: The path of report.md.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install Uphill
      if: inputs.version != 'none'
      shell: sh
      env:
        ACTION_REF: ${{ github.action_ref }}
        UPHILL_INSTALL: ${{ runner.temp }}/uphill
        VERSION: ${{ inputs.version }}
      run: |
        case "$VERSION:$ACTION_REF" in
          :v[0-9]*.[0-9]*.[0-9]*) version=$ACTION_REF ;;
          :*) version=latest ;;
          *) version=$VERSION ;;
        esac
        UPHILL_VERSION=$version sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$UPHILL_INSTALL/bin" >> "$GITHUB_PATH"

    - name: Run Uphill
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        COMPARE: ${{ inputs.compare }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        command=(uphill)

        # `--compare` checks out the revision in a worktree, so the clone must have it.
        # actions/checkout fetches only the head commit by default.
        if [ -n "$COMPARE" ]; then
          ref=$COMPARE
          if ! git rev-parse --quiet --verify "$ref^{commit}" > /dev/null; then
            depth=
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then depth=--depth=1; fi
            git fetch --no-tags $depth origin "+$ref:refs/remotes/origin/$ref"
            ref=origin/$ref
          fi
          command+=(--compare "$ref")
        fi

        read -ra args <<< "$ARGS"
        command+=("${args[@]}")

        log=$(mktemp)
        rm -f .uphill/report.md .uphill/report.json .uphill/report.html
        set +e
        "${command[@]}" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}

        # An unzipped artifact takes its file's name, so each working directory gets its own.
        html=
        if [ -f .uphill/report.html ]; then
          slug=$(printf '%s' "$WORKING_DIRECTORY" | tr -cs 'A-Za-z0-9' '-' | sed 's/^-*//; s/-*$//')
          html=$RUNNER_TEMP/uphill-report${slug:+-$slug}.html
          cp .uphill/report.html "$html"
        fi

        {
          echo "command=${command[*]}"
          echo "exit-code=$status"
          echo "html=$html"
          echo "log=$log"
          echo "report=$PWD/.uphill/report.md"
        } >> "$GITHUB_OUTPUT"

    # An unzipped HTML artifact opens in the browser, so the comment links the full report.
    - name: Upload report
      id: upload
      if: always() && steps.run.outputs.html != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        archive: false
        path: ${{ steps.run.outputs.html }}

    - name: Post report
      if: always() && steps.run.outputs.exit-code != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        COMMAND: ${{ steps.run.outputs.command }}
        COMMENT: ${{ inputs.comment }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
        GH_TOKEN: ${{ inputs.github-token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        LOG: ${{ steps.run.outputs.log }}
        MARKER: '<!-- uphill: ${{ inputs.working-directory }} -->'
        NUMBER: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.run.outputs.report }}
        REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        # One row per category, with its score in the compared revision and in this run. GitHub
        # shows only images it fetches by URL, so the gauges are files in the action's repository
        # at the action's ref. A local `uses: ./` has neither, and links them on main.
        table=
        json=${REPORT%.md}.json
        if [ -f "$json" ]; then
          base=https://raw.githubusercontent.com/${ACTION_REPOSITORY:-wevm/uphill}/${ACTION_REF:-main}/assets/gauges
          head=$([ -n "$NUMBER" ] && echo 'This PR' || echo "${HEAD_SHA:0:7}")
          table=$(jq -r --arg base "$base" --arg head "$head" '
            def gauge($label; $score; $error):
              if $score != null then "<img src=\"\($base)/\($score | floor).svg\" width=\"48\" height=\"48\" alt=\"\($label | @html): \($score | floor)\">"
              elif $error != null then "<img src=\"\($base)/failed.svg\" width=\"48\" height=\"48\" alt=\"\($label | @html): failed\">"
              else "–" end;
            .comparison as $comparison
            | ($comparison.reference // "" | split(" ")[0] | sub("^origin/"; "")) as $reference
            | [.categories[]
                | . as $category
                | ((if .subject then "\(.subject) · " else "" end) + .title) as $label
                | ($comparison.scores // [] | map(select(.category == $category.name and .subject == $category.subject)) | first) as $before
                | "<tr><td><b>\($label | @html)</b></td>"
                  + (if $comparison then "<td align=\"center\">\(if $before then gauge($label; $before.score; $before.error) else "–" end)</td>" else "" end)
                  + "<td align=\"center\">\(gauge($label; .score; .error))</td></tr>"]
            | if length == 0 then empty
              else "<table><tr><th align=\"left\">Category</th>"
                + (if $comparison then "<th>\($reference | @html)</th>" else "" end)
                + "<th>\($head | @html)</th></tr>" + join("") + "</table>"
              end' "$json") || table=
        fi

        body=$(mktemp)
        {
          echo "$MARKER"
          printf '## Uphill\n\n'
          if [ -n "$table" ]; then printf '%s\n\n' "$table"; fi
          if [ -n "$REPORT_URL" ]; then printf '**[View the full report →](%s)**\n\n' "$REPORT_URL"; fi

          # A run that wrote a report has its failures there, so only one without shows the output.
          if [ "$EXIT_CODE" != 0 ]; then
            printf '> [!CAUTION]\n> `%s` exited with status %s.\n\n' "$COMMAND" "$EXIT_CODE"
            if [ -z "$table" ]; then
              printf '<details><summary>Output</summary>\n\n```text\n'
              tail -n 60 "$LOG"
              printf '```\n\n</details>\n\n'
            fi
          fi

          printf '<sub>`%s` at %s in [run %s](%s/%s/actions/runs/%s)</sub>\n' \
            "$COMMAND" "${HEAD_SHA:0:7}" "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
        } > "$body"

        # The job summary also has the whole report, for runs without a comment.
        {
          cat "$body"
          if [ -f "$REPORT" ]; then printf '\n'; cat "$REPORT"; fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$COMMENT" != true ] || [ -z "$NUMBER" ]; then exit 0; fi

        # GitHub rejects a comment over 65,536 characters, so a long one keeps its start.
        if [ "$(wc -c < "$body")" -gt 65000 ]; then
          head -c 64000 "$body" > "$body.short"
          printf '\n\nThe comment is too long. The job summary has all of it.\n' >> "$body.short"
          mv "$body.short" "$body"
        fi

        # The comment is a convenience, so a failure to write it warns instead of failing the job.
        comments=repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments
        if ! ids=$(gh api --paginate "$comments" --jq '.[] | select(.body | startswith(env.MARKER)) | .id'); then
          echo "::warning::Uphill could not read the comments on the pull request. The job summary has the report."
          exit 0
        fi

        id=${ids%%$'\n'*}
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
        else
          gh api "$comments" -F "body=@$body" > /dev/null
        fi || echo "::warning::Uphill could not comment on the pull request, and a pull request from a fork has a read-only token. The job summary has the report."

    - name: Exit with the status of uphill
      if: steps.run.outputs.exit-code != '0'
      shell: sh
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$EXIT_CODE"
