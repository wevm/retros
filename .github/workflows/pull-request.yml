name: Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  uphill:
    name: Uphill
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup show

      # Uphill's speed script is TypeScript run by Bun.
      - name: Install Bun
        uses: wevm/actions/vendor/oven-sh/setup-bun/v2.2.0@b518cf981b50a4c745a8b7335fc693f34b108a75
        with:
          bun-version: 1.4.4

      # The action runs the uphill this pull request builds, compares it with the base branch,
      # and keeps one comment on the pull request.
      - name: Build Uphill
        run: |
          cargo build --release --locked -p uphill
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Run Uphill
        uses: ./
        with:
          version: none

  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
