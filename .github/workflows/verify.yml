name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup show

      # The examples' scripts and Retros' own speed script are TypeScript run by Bun.
      - name: Install Bun
        uses: wevm/actions/vendor/oven-sh/setup-bun/v2.2.0@b518cf981b50a4c745a8b7335fc693f34b108a75
        with:
          bun-version: 1.4.4

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      # Retros' own timings, compared with the same commit, must stay within noise on a GitHub
      # runner. This checks the verdict rule of `--compare` on real timings.
      - name: Compare with the same commit
        run: |
          cargo run --release --locked --quiet -p retros -- --compare HEAD | tee compare.txt
          grep -q '^No changes against' compare.txt

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check formatting and lint
        run: pnpm exec vp check

      - name: Check types
        run: pnpm check:types

      # zile rewrites package.json, so a change means the committed manifest is out of date.
      - name: Build package
        run: |
          pnpm build
          git diff --exit-code package.json

      - name: Build documentation site
        run: pnpm --filter @retros/site build
