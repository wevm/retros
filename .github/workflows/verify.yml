name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup show

      # The examples' scripts and Retros' own speed script are TypeScript run by Bun.
      - name: Install Bun
        uses: wevm/actions/vendor/oven-sh/setup-bun/v2.2.0@b518cf981b50a4c745a8b7335fc693f34b108a75
        with:
          bun-version: 1.4.4

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features
