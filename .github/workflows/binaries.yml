name: Binaries
on:
  # The Main workflow builds the archives for a version that npm does not have yet.
  workflow_call:
  # A manual run builds and checks every archive without releasing anything.
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The manylinux_2_28 image has glibc 2.28, so the binary runs on Debian 10, Ubuntu 20.04,
      # RHEL 8, and later. A build on the runner would need the runner's newer glibc.
      - name: Build in manylinux
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          docker run --rm -e TARGET -v "$PWD:/retros" -w /retros "quay.io/pypa/manylinux_2_28_$(uname -m)" sh -euc '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked -p retros --target "$TARGET"
            "target/$TARGET/release/retros" --version
          '

      # musl builds link statically, so they need no C library on the machine that runs them.
      - name: Build
        if: ${{ !endsWith(matrix.target, '-linux-gnu') }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked -p retros --target "$TARGET"

      - name: Run on Alpine
        if: endsWith(matrix.target, '-linux-musl')
        run: docker run --rm -v "$PWD/target/$TARGET/release:/retros:ro" alpine:3 /retros/retros --version

      # `pnpm changeset:version` sets the Cargo version to the version in npm/package.json.
      - name: Check version
        run: |
          version=$("target/$TARGET/release/retros" --version)
          expected="retros $(node -p "require('./npm/package.json').version")"
          echo "$version"
          if [ "$version" != "$expected" ]; then
            echo "::error::The binary prints '$version', but npm/package.json expects '$expected'. Run 'bun npm/version.ts'."
            exit 1
          fi

      - name: Package
        run: tar -czf "retros-$TARGET.tar.gz" -C "target/$TARGET/release" retros -C "$GITHUB_WORKSPACE" LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: retros-${{ matrix.target }}
          path: retros-${{ matrix.target }}.tar.gz
          retention-days: 7

permissions:
  contents: read
