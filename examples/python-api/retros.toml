# A Python HTTP API, measured by a script that starts the server itself.

[api]
run = "python3 metrics.py"
timeout = "1m"
# Median latency of each route. The route at the p90 is scored.
latency = { target = "1ms" }
# Requests per second to one route. Higher is better, so half the target scores 50.
throughput = { target = 2000, better = "higher" }
# Whether `/health` answers with status 200.
health = {}
