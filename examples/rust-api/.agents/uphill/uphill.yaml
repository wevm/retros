# Harbor, a forecast API on Rust's standard library. The scripts run Cargo's own tools, and start
# the server themselves to time and probe it. It misses targets on purpose: the forecast endpoint
# recomputes each hour from the start of the week, and `/search` without `q` panics instead of
# answering 400.

footprint:
  run: bun .agents/uphill/metrics/footprint.ts
  # Bytes of the stripped release binary.
  binary-size: {}
  # Third-party crates the binary compiles.
  dependencies: {}

latency:
  run: bun .agents/uphill/metrics/latency.ts
  timeout: 2m
  # Median time per request of each endpoint. The script sets each endpoint's target from the work
  # it does, from 500 µs for `/health` to 2 ms for the forecast.
  latency: {}
  # 95th percentile time per request of each endpoint, against three times its median target.
  tail-latency: {}
  # Requests per second to `/harbors/12` from 16 concurrent clients. Higher is better.
  throughput: { better: higher }

reliability:
  run: bun .agents/uphill/metrics/reliability.ts
  # Whether each request gets the status it should.
  status: {}
  # Whether a request that is not HTTP gets 400.
  malformed-request: {}
  # Whether the server still answers after a handler panics.
  survives-panic: {}
  # Percentage of 400 concurrent requests that fail or answer 5xx.
  error-rate: {}

# The rust pack's `testing` merges with this one.
testing:
  run: bun .agents/uphill/metrics/tests.ts
  # Whether each test passes in `cargo test`.
  passing: {}

# Rust conventions in each source file and manifest, such as clippy, rustfmt, panics, docs, and the
# workspace's lints, in categories such as `correctness` and `style`. The repository's commit pins
# the pack.
packs:
  - { pack: ../../packs/rust, install: true }
