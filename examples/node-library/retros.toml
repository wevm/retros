# A JavaScript library, measured by Node scripts.

[footprint]
run = "node metrics/footprint.mjs"
# Gzipped bytes of each entry point and the modules it imports.
entry-size = { target = "1kB" }

[speed]
run = "node metrics/speed.mjs"
# Time to import each entry point in a fresh process.
import-time = { target = "1ms" }
