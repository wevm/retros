# Tide, a small marketing site, measured by Lighthouse in its default mobile mode. The script runs
# Lighthouse on each page and writes the results as metric lines. The site misses targets on
# purpose: the pricing page loads the landing page's hero image without alt text and a script
# that blocks rendering, and the about page skips a heading level, has a "click here" link, no
# description, and no icon, so the browser logs a 404 for /favicon.ico.

# Installs packages in each checkout that `uphill --compare` and `uphill blame` create.
setup: bun install --frozen-lockfile

performance:
  run: bun metrics/lighthouse.ts performance
  # Lighthouse's five metrics on each page, with Lighthouse's weights. The pages weigh a few
  # kilobytes, so the targets are stricter than Lighthouse's. The landing page loads a hero image.
  first-contentful-paint: { target: 800ms, weight: 10 }
  largest-contentful-paint: { target: 1s, targets: { index.html: 1.5s }, weight: 25 }
  total-blocking-time: { target: 50ms, weight: 30 }
  cumulative-layout-shift: { target: 0.05, weight: 25 }
  speed-index: { target: 1s, weight: 10 }
  # Bytes each page transfers, with everything it loads.
  total-byte-weight: { target: 3kB, targets: { index.html: 8kB }, weight: 10 }

accessibility:
  run: bun metrics/lighthouse.ts accessibility
  # Whether each page passes each accessibility audit that counts toward Lighthouse's score.
  audits: {}

best-practices:
  # Reports show a title, or else the name in words.
  title: Best Practices
  run: bun metrics/lighthouse.ts best-practices
  audits: {}

seo:
  title: SEO
  run: bun metrics/lighthouse.ts seo
  audits: {}
