<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing | Tide</title>
    <meta name="description" content="Tide is free for one harbor. Crew and Fleet plans add harbors, alerts, and route planning." />
    <link rel="canonical" href="https://tide.example/pricing.html" />
    <link rel="stylesheet" href="/styles/site.css" />
    <script src="/app.js"></script>
  </head>
  <body>
    <header>
      <img src="/images/logo.svg" alt="Tide" width="96" height="32" />
      <nav>
        <a href="/">Home</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/about.html">About</a>
      </nav>
    </header>
    <main>
      <h1>Pricing</h1>
      <img src="/images/hero.svg" width="640" height="320" />
      <h2>Plans</h2>
      <table>
        <tr><th>Plan</th><th>Harbors</th><th>Price</th></tr>
        <tr><td>Deckhand</td><td>1</td><td>Free</td></tr>
        <tr><td>Crew</td><td>5</td><td>$4 a month</td></tr>
        <tr><td>Fleet</td><td>Unlimited</td><td>$12 a month</td></tr>
      </table>
      <button type="button" data-plan="crew">Choose Crew</button>
      <button type="button" data-plan="fleet" aria-label="Choose Fleet"></button>
    </main>
  </body>
</html>
